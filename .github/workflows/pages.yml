# Publica a pasta public/ (cardápio, cozinha, status e histórico) no GitHub Pages,
# copiando-a para a branch gh-pages a cada push na main.
# No GitHub Pages não há servidor Node.js: o front-end fala direto com o Supabase
# (ver public/config.js e supabase/public-access.sql).
#
# Configuração única no GitHub: Settings → Pages → Source: "Deploy from a branch",
# Branch: gh-pages / (root).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar public/ na branch gh-pages
        run: |
          cd public
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
