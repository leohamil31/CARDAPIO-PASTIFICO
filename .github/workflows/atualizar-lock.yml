name: Atualizar package-lock
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Salvar package-lock.json
        run: |
          git config user.name "Leonardo Hamilton"
          git config user.email "leonardohamilton5@gmail.com"
          git add package-lock.json
          git commit -m "Atualiza package-lock.json com Vitest e cobertura" || echo "sem mudanças"
          git push
