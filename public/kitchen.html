<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1513" />
    <title>Pastifico | Cozinha ao vivo</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👨‍🍳</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="kitchen-page">
    <header class="kitchen-header">
      <div class="kitchen-title">
        <a class="brand brand-light" href="index.html" aria-label="Voltar ao cardápio">
          <span class="brand-mark" aria-hidden="true">P</span>
        </a>
        <div>
          <p class="kicker">Painel da cozinha</p>
          <h1>Pedidos ao vivo</h1>
        </div>
      </div>
      <div class="kitchen-tools">
        <span class="live-status" id="live-status" data-state="connecting"><span class="pulse-dot" aria-hidden="true"></span><span id="live-label">Conectando…</span></span>
        <time class="clock" id="clock" aria-label="Hora atual"></time>
        <button class="tool-button" id="sound-toggle" type="button" aria-pressed="false" title="Aviso sonoro de novo pedido">🔕 Som</button>
        <button class="tool-button" id="pin-button" type="button" hidden>🔒 Entrar</button>
      </div>
    </header>

    <main class="kitchen-board" aria-live="polite">
      <section class="kitchen-column" data-status="Recebido" aria-labelledby="col-received">
        <header><h2 id="col-received">Novos</h2><span class="count" data-count="Recebido">0</span></header>
        <div class="kitchen-list" data-list="Recebido"></div>
      </section>
      <section class="kitchen-column" data-status="Preparando" aria-labelledby="col-preparing">
        <header><h2 id="col-preparing">Em preparo</h2><span class="count" data-count="Preparando">0</span></header>
        <div class="kitchen-list" data-list="Preparando"></div>
      </section>
      <section class="kitchen-column" data-status="Pronto" aria-labelledby="col-ready">
        <header><h2 id="col-ready">Prontos</h2><span class="count" data-count="Pronto">0</span></header>
        <div class="kitchen-list" data-list="Pronto"></div>
      </section>
    </main>

    <div id="pin-modal" class="modal" hidden>
      <form class="modal-card pin-card" role="dialog" aria-modal="true" aria-labelledby="pin-title" id="pin-form">
        <button class="icon-button modal-close" type="button" id="pin-close" aria-label="Fechar">×</button>
        <p class="kicker">Acesso da equipe</p>
        <h3 id="pin-title">PIN da cozinha</h3>
        <p class="muted small">Qualquer pessoa pode acompanhar os pedidos. Para mudar o status, informe o PIN.</p>
        <input id="pin-input" class="pin-input" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="••••••" required />
        <p class="form-error" id="pin-error" role="alert"></p>
        <div class="modal-actions">
          <button class="button button-primary button-block" type="submit">Entrar</button>
        </div>
      </form>
    </div>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="kitchen.js"></script>
  </body>
</html>
