<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#120d0b" />
    <title>Pastifico | Cozinha ao vivo</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="staff-page kitchen-page">
    <header class="site-header staff-header">
      <div class="site-header-inner">
        <a class="brand" href="kitchen.html" aria-label="Pastifico — painel da cozinha">
          <img class="brand-logo" src="logo-pastifico-claro.svg" alt="Pastifico" width="529" height="200" />
        </a>
        <div class="page-title">
          <p class="kicker">Painel da cozinha</p>
          <h1>Pedidos ao vivo</h1>
        </div>
        <div class="header-tools">
          <span class="live-status" id="live-status" data-state="connecting"><span class="pulse-dot" aria-hidden="true"></span><span id="live-label">Conectando…</span></span>
          <time class="clock" id="clock" aria-label="Hora atual"></time>
          <button class="tool-button" id="sound-toggle" type="button" aria-pressed="false" title="Aviso sonoro de novo pedido">Som desligado</button>
          <a class="tool-button" href="order-history.html">Histórico</a>
          <button class="tool-button" id="logout-button" type="button" hidden>Sair</button>
        </div>
      </div>
    </header>

    <main class="kitchen-board" aria-live="polite">
      <section class="kitchen-column" data-status="Recebido" aria-labelledby="col-received">
        <header><h2 id="col-received">Novos</h2><span class="count" data-count="Recebido">0</span></header>
        <div class="kitchen-list" data-list="Recebido"></div>
      </section>
      <section class="kitchen-column" data-status="Preparando" aria-labelledby="col-preparing">
        <header><h2 id="col-preparing">Em preparo</h2><span class="count" data-count="Preparando">0</span></header>
        <div class="kitchen-list" data-list="Preparando"></div>
      </section>
      <section class="kitchen-column" data-status="Pronto" aria-labelledby="col-ready">
        <header><h2 id="col-ready">Prontos</h2><span class="count" data-count="Pronto">0</span></header>
        <div class="kitchen-list" data-list="Pronto"></div>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="motion.js"></script>
    <script src="kitchen.js"></script>
  </body>
</html>
